tls:
  certificates:
    - certFile: /pki/ocsptest.docker.localhost.crt
      keyFile: /pki/ocsptest.docker.localhost.key

  options:
    default:
      sniStrict: true
      minVersion: VersionTLS13

    testcerts:
      clientAuth:
        clientAuthType: RequireAndVerifyClientCert
        caFiles:
          - /pki/intermediate_ca.crt
