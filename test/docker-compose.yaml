services:
  traefik:
    image: traefik:v3.3.6
    #image: traefik:v2.10.5
    command: >-
      --log.level=DEBUG
      --api.insecure=true
      --providers.docker
      --experimental.plugins.ocsp.modulename=github.com/project-echo/traefik-ocsp
      --experimental.plugins.ocsp.version=v0.1.4
      --experimental.localPlugins.ocsplocal.modulename=github.com/project-echo/traefik-ocsp
      --entryPoints.web.address=:80
      --entryPoints.websecure.address=:443
      --entrypoints.websecure.http.tls=true
      --providers.file.directory=/config
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/plugins-local/src/github.com/project-echo/traefik-ocsp
      - ./pki:/pki
      - ./config:/config

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin
    labels:
      - "traefik.http.routers.httpbin.entrypoints=web"
      - "traefik.http.routers.httpbin.rule=Host(`httpbin.docker.localhost`)"
      - "traefik.http.middlewares.ocsp-rewrite.plugin.ocsplocal.mode=rewrite"
      - "traefik.http.middlewares.ocsp-rewrite.plugin.ocsplocal.rewrite.pathPrefixes[0]=/anything/ocsp"
      - "traefik.http.routers.httpbin.middlewares=ocsp-rewrite@docker"

  ocsptest:
    image: ghcr.io/mccutchen/go-httpbin
    labels:
      - "traefik.http.routers.ocsptest.entrypoints=websecure"
      - "traefik.http.routers.ocsptest.rule=Host(`ocsptest.docker.localhost`)"
      - "traefik.http.routers.ocsptest.tls.options=testcerts@file"
      - "traefik.http.routers.ocsptest.middlewares=ocsp-check@docker"
      - "traefik.http.middlewares.ocsp-check.plugin.ocsplocal.mode=check"
      - "traefik.http.middlewares.ocsp-check.plugin.ocsplocal.debug=true"
      - "traefik.http.middlewares.ocsp-check.plugin.ocsplocal.issuers[0].ocspEndpoint=http://ocspfixture.docker.localhost/ocsp"
      - "traefik.http.middlewares.ocsp-check.plugin.ocsplocal.issuers[0]."

  ocspfixture:
    build: .
    labels:
      - "traefik.http.routers.ocspfixture.entrypoints=web"
      - "traefik.http.routers.ocspfixture.rule=Host(`ocspfixture.docker.localhost`)"
