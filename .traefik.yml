displayName: "Traefik OCSP request rewriter and revocation checker"
type: middleware
iconPath: .assets/icon.png

import: github.com/project-echo/traefik-ocsp

summary: "Convert OCSP GET request to POST request, and do live OCSP revocation checks"

testData:
  mode: "rewrite"
  rewrite:
    pathPrefixes: ["/ocsp"]
    pathRegexp: "^/v1/[^/]+/(unified-)?ocsp"

testData2:
  mode: "check"
  issuers:
    - ocspEndpoint: https://example.com/ca1/ocsp
      issuerPem: |
        -----BEGIN CERTIFICATE-----
        ...
        -----END CERTIFICATE-----
    - ocspEndpoint: https://example.com/ca2/ocsp
      issuerPem: |
        -----BEGIN CERTIFICATE-----
        ...
        -----END CERTIFICATE-----
